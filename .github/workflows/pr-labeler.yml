name: PR Auto Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest

    steps:
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            shared_function:
              - 'GitHubActionsPractice/subfolder/**'

      - name: Update Shared Function label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.changes.outputs.shared_function }}" == "true" ]]; then
            gh pr edit ${{ github.event.pull_request.number }} \
              --add-label "test"
          else
            gh pr edit ${{ github.event.pull_request.number }} \
              --remove-label "test" || true
          fi
